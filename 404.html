<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Досыта на ПП</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ice:#EEF4F3;--ink:#172420;--mist:#5A6B65;--spruce:#1E4D3A;--on-spruce:#fff}
@media (prefers-color-scheme: dark){:root{--ice:#0E1614;--ink:#E6EFEB;--mist:#93A59E;--spruce:#7CC4A2;--on-spruce:#0E1614}}
html{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ice);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:28em;text-align:center}
h1{font:700 30px/1.15 Georgia,serif;margin:0 0 10px}
p{margin:0 0 22px;color:var(--mist)}
a.btn{display:inline-block;background:var(--spruce);color:var(--on-spruce);font-weight:600;text-decoration:none;padding:13px 22px;border-radius:12px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела. Каталог и корзина находятся на главной странице.</p>
  <a class="btn" href="/">Перейти в каталог</a>
</main>
</body>
</html>
